            <h1 class="fade-in">May Giacinto</h1>
            <section class="nav">


                <input class="nav-toggle" id="nav-toggle" type="checkbox">

                <label class="hamburger" for="nav-toggle">
                    <span class="sr-only">Open or close menu</span>
                    <span class="bar"></span>

        <main>
            <div class="logo-intro"></div>
            <div class="wrapper">
                <h2>Get in Touch</h2>
                <p id="contact">Sections with <span class="required">*</span> are required.</p>

                <form action="" method="get">

                    <label for="name">Full Name<span class="required">*</span></label>
                    <input type="text" id="name">
                    <label for="email">Email<span class="required">*</span></label>
                    <input type="email" id="email">
                    <label for="phone">Phone Number</label>
                    <input type="number" id="phone">
                    <label for="comments">Message<span class="required">*</span></label>
                    <textarea type="text" id="comments"></textarea>
                    <input type="submit">
                </form>
                <p>All contact inquiries will be responded to within 3 to 5 business days. Thank you!</p>
        </div>
        </main>
